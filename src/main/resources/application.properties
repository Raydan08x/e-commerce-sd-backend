# Configuración general de la aplicación
spring.application.name=e-commerce-sierra-dorada-backend
server.port=${PORT:8081}

# Conexión local a MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/e-commerce-sierra-dorada?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME:ecommerce_sd}
spring.datasource.password=${DB_PASSWORD:Sierra2026*}

# Persistencia con JPA e Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# Autenticación mediante JWT
app.jwt.secret=${JWT_SECRET:SierraDoradaJwtSecretKeyDevelopment2026ChangeMe}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Orígenes autorizados para consumir la API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,https://raydan08x.github.io}
