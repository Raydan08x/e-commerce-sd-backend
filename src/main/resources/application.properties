# Configuración general de la aplicación
spring.application.name=e-commerce-sierra-dorada-backend
server.port=${CONTAINER_PORT}

# Conexión local a MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Persistencia con JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Autenticación mediante JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=36000000

# Orígenes autorizados para consumir la API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
