# Base de datos en memoria compatible con MySQL para las pruebas
spring.datasource.url=jdbc:h2:mem:sierradorada;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# El esquema se crea y elimina en cada ejecución de pruebas
spring.jpa.hibernate.ddl-auto=create-drop

# Seguridad y CORS exclusivos del entorno de pruebas
app.jwt.secret=SierraDoradaJwtSecretKeyForAutomatedTests2026
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5500
